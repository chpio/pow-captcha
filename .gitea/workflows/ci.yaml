name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # turbo would send anonymous usage data and look for a newer release otherwise. pnpm skips its own
  # update check in CI.
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_NO_UPDATE_NOTIFIER: "1"

jobs:
  # the fast checks that don't compile, in parallel to the test job. Each runs even if one before
  # failed, so a run reports all of them.
  check:
    runs-on: ubuntu-latest
    # built in the git/images repo, meant to float like in the test job
    container: ${{ vars.DOCKER_REGISTRY }}/git/rust-wasm:latest # zizmor: ignore[unpinned-images]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --check
        working-directory: pkgs/solver-wasm
      - if: ${{ !cancelled() }}
        run: cargo deny --locked check
        working-directory: pkgs/solver-wasm
      - if: ${{ !cancelled() }}
        run: cargo machete
        working-directory: pkgs/solver-wasm
      - if: ${{ !cancelled() }}
        run: typos
      # both only look into .github/workflows on their own
      - if: ${{ !cancelled() }}
        run: actionlint .gitea/workflows/*.yaml
      - if: ${{ !cancelled() }}
        run: zizmor --offline .gitea/workflows/*.yaml
      # same as in the test job
      - id: pnpm-store
        if: ${{ !cancelled() }}
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - id: pnpm-install
        if: ${{ !cancelled() }}
        run: pnpm install
      - if: ${{ !cancelled() && steps.pnpm-install.outcome == 'success' }}
        run: pnpm exec prettier --check .
      - if: ${{ !cancelled() && steps.pnpm-install.outcome == 'success' }}
        run: pnpm exec eslint .
      - if: ${{ !cancelled() && steps.pnpm-install.outcome == 'success' }}
        run: pnpm --filter benchmark lint

  test:
    runs-on: ubuntu-latest
    # built in the git/images repo
    # The image runs rustc through sccache. Its storage (SCCACHE_REDIS_ENDPOINT and
    # SCCACHE_REDIS_PASSWORD) comes from the runner for every job; don't set it here, an empty
    # value would override it. The image is meant to float: it's rebuilt with the current toolchain
    # and tools every week.
    container: ${{ vars.DOCKER_REGISTRY }}/git/rust-wasm:latest # zizmor: ignore[unpinned-images]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: pkgs/solver-wasm
      - run: cargo doc --no-deps --locked
        working-directory: pkgs/solver-wasm
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --locked
        working-directory: pkgs/solver-wasm
      # The store only, node_modules is linked from it in seconds. With the frozen lockfile (the
      # default in CI) pnpm asks the registry for no metadata and downloads only the tarballs the
      # store lacks. No restore-keys: a store restored from an older lockfile would carry its
      # packages on into every new cache. The path is asked for in the checkout, pnpm keeps the
      # store on the file system of the project (to hard link from it), at its root when the home
      # directory is on another one.
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install
      # wasm-pack downloads the wasm-bindgen CLI of exactly the version in Cargo.lock, the image
      # can't bring it (wasm-opt comes with the image)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/.wasm-pack
          key: wasm-pack-${{ hashFiles('pkgs/solver-wasm/Cargo.lock') }}
      - run: pnpm build
      - run: pnpm --filter @pow-captcha/pow-captcha test
      # needs the types of the built library
      - run: pnpm --filter benchmark check
      - run: sccache --show-stats
        if: always()
