# cargo-deny config (https://embarkstudios.github.io/cargo-deny/), run in CI by `cargo deny check`

[advisories]
# the defaults: vulnerabilities, unmaintained and unsound crates fail, yanked crates warn

[licenses]
# Unicode-3.0 comes in through unicode-ident; every other license in the tree is only an alternative
# to one of these
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[licenses.private]
# the crate itself has no license, it's only published as part of the npm package
ignore = true

[bans]
# several versions of one crate are often unavoidable, so they only warn
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
